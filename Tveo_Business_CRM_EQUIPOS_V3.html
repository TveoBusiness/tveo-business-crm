<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3d91"><meta name="mobile-web-app-capable" content="yes">
<title>Tveo Business CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#162033;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
.badge{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:bold;text-decoration:none;display:inline-block}
.badge.meet{background-color:#d93025;color:#fff}
.primary{background:#0b3d91;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-weight:bold}
.field input,.field select{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">
  <!-- Cabecera y Buscador -->
  <div style="padding:20px;">
    <h2>Prospectos y Seguimientos Commerciales</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <input type="text" id="search" placeholder="Buscar por Nombre, Teléfono, Nivel (A/B/C), Asesor..." onkeyup="filterTable()" style="flex:1; padding:10px; border-radius:4px; border:1px solid #ccc;">
      <button class="primary" onclick="exportarProspectosExcel()" style="background-color: #21a366;">📊 Reporte Excel</button>
    </div>

    <!-- Tabla de Prospectos -->
    <table border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse:collapse; background:#fff;">
      <thead>
        <tr style="background:#f0f4f8;">
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Nivel</th>
          <th>Asesor / Asesora</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="ptable">
        <!-- Carga dinámica -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal de Edición de Integrante / Perfil -->
<div id="profileModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; width:400px;">
    <h3>Editar Integrante del Equipo</h3>
    <div class="field">
      <label>Nombre Completo</label>
      <input type="text" id="profileName">
    </div>
    <div class="field">
      <label>Rol</label>
      <select id="profileRole">
        <option value="administrador">Administrador</option>
        <option value="team_leader">Team Leader</option>
        <option value="asesor">Asesor / Asesora</option>
      </select>
    </div>
    <div class="field">
      <label>Enlace de Google Meet (Sala Personal)</label>
      <input type="text" id="profileMeet" placeholder="https://meet.google.com/abc-defg-hij">
    </div>
    <button class="primary" onclick="saveProfile()">Guardar Cambios</button>
    <button onclick="closeModal()" style="margin-left:10px;">Cancelar</button>
  </div>
</div>

<script>
// Referencia simple de utilidades
const $ = id => document.getElementById(id);
const esc = str => (str || "").toString().replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Base de datos local/estado global
window.prospectsList = [];

// 1. Buscador Filtrado por Nombre, Teléfono, Proyecto, Estado, Nivel (Grade) y Asesor
async function filterTable() {
  try {
    const q = ($("search")?.value || "").toLowerCase().trim();
    const filtered = window.prospectsList.filter(x => {
      const name = (x.name || "").toLowerCase();
      const phone = (x.phone || "").toLowerCase();
      const project = (x.project_name || "").toLowerCase();
      const status = (x.status || "").toLowerCase();
      const grade = (x.grade || "").toLowerCase(); // Nivel A, B, C
      const advisor = (x.advisor_name || x.agent_name || "").toLowerCase(); // Asesor / Asesora

      return name.includes(q) || 
             phone.includes(q) || 
             project.includes(q) || 
             status.includes(q) || 
             grade.includes(q) || 
             advisor.includes(q);
    });
    
    renderProspectRows(filtered);
  } catch(e) {
    console.error("Error en la búsqueda:", e);
  }
}

// 2. Renderizar filas de la tabla con URLs seguras para Google Meet
function renderProspectRows(data) {
  const tbody = $("ptable");
  if (!tbody) return;
  
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No se encontraron registros.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(x => {
    // Formatear URL de Meet asegurando el protocolo https://
    let rawMeet = x.meet_url || "";
    let formattedMeet = rawMeet ? (rawMeet.startsWith("http") ? rawMeet : "https://" + rawMeet) : "";
    
    return `
      <tr>
        <td>${esc(x.name)}</td>
        <td>${esc(x.phone)}</td>
        <td><strong>${esc(x.grade || "-")}</strong></td>
        <td>${esc(x.advisor_name || x.agent_name || "Sin Asignar")}</td>
        <td>${esc(x.status || "Nuevo")}</td>
        <td>
          ${formattedMeet ? `<a href="${esc(formattedMeet)}" target="_blank" class="badge meet">🎥 Entrar</a>` : '<span style="color:#888;">Sin sala</span>'}
        </td>
      </tr>
    `;
  }).join("");
}

// 3. Formateador de Nombres de Roles
const getRoleLabel = role => {
  if (role === "administrador") return "Administrador";
  if (role === "team_leader") return "Team Leader";
  return "Asesor / Asesora";
};

// 4. Exportar Reporte General a Excel (.CSV)
function exportarProspectosExcel() {
  if (!window.prospectsList || window.prospectsList.length === 0) {
    alert("No hay datos disponibles para exportar.");
    return;
  }

  let csvContent = "\uFEFF"; // Compatibilidad de tildes y caracteres especiales en Excel
  csvContent += "Cliente;Teléfono;Nivel;Asesor / Asesora;Estado;Sala Meet\n";

  window.prospectsList.forEach(f => {
    let cliente = (f.name || "").replace(/;/g, ",");
    let telefono = (f.phone || "").replace(/;/g, ",");
    let nivel = (f.grade || "").replace(/;/g, ",");
    let asesor = (f.advisor_name || f.agent_name || "").replace(/;/g, ",");
    let estado = (f.status || "").replace(/;/g, ",");
    let meet = (f.meet_url || "").replace(/;/g, ",");

    csvContent += `"${cliente}";"${telefono}";"${nivel}";"${asesor}";"${estado}";"${meet}"\n`;
  });

  let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  let url = URL.createObjectURL(blob);
  let link = document.createElement("a");
  
  let hoy = new Date().toISOString().slice(0, 10);
  link.setAttribute("href", url);
  link.setAttribute("download", `Reporte_Prospectos_${hoy}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function closeModal() {
  $("profileModal").style.display = "none";
}
</script>

</body>
</html>
