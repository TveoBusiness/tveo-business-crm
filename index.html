<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tveo Business CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#162033;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#1565c0;color:#fff}.light{background:#eaf0f8;color:#17365f}.danger{background:#fee2e2;color:#991b1b}.meet{background:#ea4335;color:#fff}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0b3d91,#102b52);padding:20px}.box{background:#fff;border-radius:20px;padding:26px;width:min(520px,100%);box-shadow:0 20px 60px #0004}.logo{font-weight:900;color:#0b3d91;font-size:24px}.muted{font-size:12px;color:#6b7280}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;color:#657086;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dbe2ec;border-radius:9px;background:#fff}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#0b1f3a;color:#fff;padding:20px;z-index:20}.brand{font-weight:900;font-size:21px;margin-bottom:22px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dbeafe;margin:3px 0}.nav button.active{background:#17365f}.main{margin-left:240px;padding:24px;max-width:1450px}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid #e6ebf2;border-radius:15px;padding:16px;margin:12px 0}.num{font-size:28px;font-weight:900}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{padding:11px;border:1px solid #dbe2ec;border-radius:9px;flex:1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 7px;border-bottom:1px solid #e8edf3;text-align:left;font-size:13px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;padding:12px;z-index:50}.modal.show{display:flex}.modal .box{max-height:94vh;overflow:auto;width:100%;max-width:720px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.toast{position:fixed;right:15px;bottom:15px;background:#162033;color:#fff;padding:12px;border-radius:10px;display:none;z-index:100}.logout{position:absolute;bottom:18px;left:20px;right:20px;background:#17365f;color:#fff}.empty{padding:20px;text-align:center;color:#6b7280}.actions{display:flex;gap:5px}@media(max-width:800px){.side{display:none}.main{margin-left:0;padding:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <div class="logo">TVEO BUSINESS</div>
    <div class="muted">CRM COMERCIAL ONLINE</div>
    <h2>Iniciar sesión</h2>
    <div class="field"><label>Correo</label><input id="email" type="email"></div>
    <div class="field"><label>Contraseña</label><input id="password" type="password"></div>
    <button class="primary" style="width:100%" onclick="signIn()">Ingresar</button>
  </div>
</div>

<div id="app" class="app">
  <aside class="side">
    <div class="brand">TVEO <span>BUSINESS</span></div>
    <nav class="nav">
      <button class="active" onclick="go('dashboard',this)">📊 Dashboard</button>
      <button onclick="go('prospectos',this)">👥 Prospectos</button>
    </nav>
    <button class="logout" onclick="signOut()">Salir</button>
  </aside>
  <main class="main">
    <h1 id="title">Dashboard</h1>
    <section id="dashboard" class="view active">
      <div class="card"><div class="num" id="totalProspects">0</div><span class="muted">Prospectos totales</span></div>
    </section>
    <section id="prospectos" class="view">
      <div class="card">
        <div class="toolbar"><input class="search" id="search" placeholder="Buscar prospecto..." oninput="filterTable()"></div>
        <div id="ptable"><div class="empty">Cargando prospectos...</div></div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
const CONFIG = {
  url: "https://mfkdhrwtlmfdmuntsbav.supabase.co",
  key: "sb_publishable_ddzIlLZE4Eoo3RyNkozzzw_RF0a1WAp"
};
const supabaseClient = supabase.createClient(CONFIG.url, CONFIG.key);
let lastProspects = [];

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 4000);
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !password) return toast("Ingresa correo y contraseña");
  
  try {
    toast("Conectando...");
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) throw error;
    boot();
  } catch(e) {
    toast("Error: " + (e.message || e));
  }
}

async function signOut() {
  await supabaseClient.auth.signOut();
  location.reload();
}

function boot() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadData();
}

function go(id, btn) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  document.getElementById("title").textContent = id === "dashboard" ? "Dashboard" : "Prospectos";
}

async function loadData() {
  try {
    const { data, error } = await supabaseClient.from("prospects").select("*").order("created_at", { ascending: false });
    if(error) throw error;
    lastProspects = data || [];
    document.getElementById("totalProspects").textContent = lastProspects.length;
    renderTable(lastProspects);
  } catch(e) {
    document.getElementById("ptable").innerHTML = `<div class="empty">Error al cargar datos: ${e.message}</div>`;
  }
}

function renderTable(arr) {
  if(!arr.length) {
    document.getElementById("ptable").innerHTML = '<div class="empty">No hay prospectos.</div>';
    return;
  }
  let html = '<div class="tablewrap"><table class="table"><tr><th>Cliente</th><th>Teléfono</th><th>Estado</th></tr>';
  arr.forEach(x => {
    html += `<tr><td><b>${x.name || ""}</b></td><td>${x.phone || ""}</td><td><span class="badge">${x.status || "Nuevo"}</span></td></tr>`;
  });
  html += '</table></div>';
  document.getElementById("ptable").innerHTML = html;
}

function filterTable() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = lastProspects.filter(x => (x.name || "").toLowerCase().includes(q) || (x.phone || "").toLowerCase().includes(q));
  renderTable(filtered);
}

// Verificar si ya hay sesión activa al abrir
supabaseClient.auth.getSession().then(({ data }) => {
  if(data.session) boot();
});
</script>

</body>
</html>
